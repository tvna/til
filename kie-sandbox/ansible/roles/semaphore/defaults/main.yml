---
semaphore_version: "v2.19.14"
semaphore_postgres_image: "docker.io/library/postgres:17-alpine"
semaphore_dir: /opt/semaphore
semaphore_port: 3000
semaphore_public_host: "{{ ansible_host }}"

semaphore_admin_username: admin
semaphore_admin_name: Semaphore Admin
semaphore_admin_email: admin@localhost
semaphore_admin_password: ""

# Active Directory / LDAP 連携 (OSS 版で利用可)
semaphore_ldap_enabled: false
semaphore_ldap_host: ""
semaphore_ldap_port: 389
semaphore_ldap_needtls: false
semaphore_ldap_bind_dn: ""
semaphore_ldap_password: ""
semaphore_ldap_search_dn: ""
semaphore_ldap_search_filter: "(uid=%s)"
semaphore_ldap_mapping_username: uid
semaphore_ldap_mapping_fullname: cn
semaphore_ldap_mapping_email: mail
